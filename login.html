<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Authentication</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="auth-container">

    <div class="auth-card">

      <div class="logo">N<span>.</span></div>

      <h1>Welcome Back</h1>
      <p class="subtitle">Login to your account</p>

      <form id="login-form">
        <div class="input-group">
          <label for="email">Email Address</label>
          <input type="email" id="email-log" placeholder="Enter your email" required>
        </div>

        <div class="input-group">
          <label for="password-log">Password</label>
          <input type="password" id="password-log" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn" id="log-btn" type="submit">
          Sign In
        </button>
      </form>

      <div class="separator">
        <span>OR</span>
      </div>

      <p class="bottom-text">
        Don't have an account?
        <a href="index.html">Create Account</a>
      </p>

    </div>

  </div>
  <script src="./app.js" type="module"></script>
</body>

</html>
