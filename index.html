<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Authentication</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card register-card">

            <div class="logo">N<span>.</span></div>

            <h1>Create Account</h1>
            <p class="subtitle">Join us and get started</p>

            <form id="Register-form">
                <div class="input-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name-res" placeholder="Enter your full name" required>
                </div>

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email-res" placeholder="Enter your email" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password-res" placeholder="Create a password" required>
                </div>

                <button type="submit" class="btn" id="res-btn">
                    Create Account
                </button>
            </form>

            <p class="bottom-text">
                Already have an account?
                <a href="login.html">Sign In</a>
            </p>

        </div>

    </div>
    <script src="app.js" type="module"></script>
</body>


</html>
